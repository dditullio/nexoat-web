server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # sitemap.xml vive en la API (se arma desde la base de datos, ver
    # docs/features/seo.md) pero tiene que exponerse en el dominio del
    # contenido, no en el de la API — "backend" resuelve por DNS interno de
    # Docker Compose (mismo patrón que docker-compose.prod.yml).
    location = /sitemap.xml {
        proxy_pass http://backend:3001/sitemap.xml;
        proxy_set_header Host $host;
    }

    # SPA fallback — todas las rutas van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
