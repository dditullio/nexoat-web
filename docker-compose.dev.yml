services:
  postgres:
    image: postgres:16-alpine
    container_name: nexoat-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexoat_dev
      POSTGRES_USER: nexoat
      POSTGRES_PASSWORD: nexoat_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexoat']
      interval: 10s
      timeout: 5s
      retries: 5

  # HTML→PDF para los ebooks de regalo generados al vuelo (fase 2, ver
  # docs/features/welcome-ebook-gift.md) — sin estado, sin volumen. Puerto
  # 3002 porque 3000/3001 ya los usan frontend/backend en desarrollo.
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: nexoat-gotenberg-dev
    restart: unless-stopped
    ports:
      - '3002:3000'

volumes:
  postgres_dev_data:
