services:
  postgres:
    image: postgres:16-alpine
    container_name: nexoat-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexoat_dev
      POSTGRES_USER: nexoat
      POSTGRES_PASSWORD: nexoat_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexoat']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
