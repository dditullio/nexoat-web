# Despliegue de producción detrás de Traefik (ya corriendo en el VPS,
# compartido con otras apps — ver docs/features/, sección deploy).
# Backend/frontend sin puertos publicados al host: Traefik descubre los
# contenedores vía el socket de Docker y los enruta por su red interna,
# igual que el resto de las apps del servidor. TLS automático vía
# Let's Encrypt (certresolver "letsencrypt", ya configurado en el Traefik
# del VPS).
services:
  postgres:
    image: postgres:16-alpine
    container_name: nexoat-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexoat}
      POSTGRES_USER: ${POSTGRES_USER:-nexoat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Puerto publicado al host (y por lo tanto a internet, sin firewall de
    # por medio) a propósito, para acceder con DBeaver/similar durante la
    # fase inicial de implementación. Riesgo aceptado temporalmente por el
    # usuario (2026-08-19) — cerrar más adelante (ver docs/features/, o
    # restringir a localhost + túnel SSH).
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nexoat}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # Contexto = raíz del repo (no ./backend): el Dockerfile copia
    # package.json/pnpm-lock.yaml/pnpm-workspace.yaml de la raíz del
    # monorepo antes de instalar con --filter, así que necesita verlos.
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nexoat-backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexoat}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexoat}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.nexoat-api.entrypoints=websecure
      - traefik.http.routers.nexoat-api.rule=Host(`${BACKEND_DOMAIN}`)
      - traefik.http.routers.nexoat-api.tls.certresolver=letsencrypt
      - traefik.http.services.nexoat-api.loadbalancer.server.port=3001

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: https://${BACKEND_DOMAIN}/v1
        VITE_UMAMI_SRC: ${VITE_UMAMI_SRC}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID}
    container_name: nexoat-frontend
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.nexoat-web.entrypoints=websecure
      - traefik.http.routers.nexoat-web.rule=Host(`${FRONTEND_DOMAIN}`)
      - traefik.http.routers.nexoat-web.tls.certresolver=letsencrypt
      - traefik.http.services.nexoat-web.loadbalancer.server.port=80
      # www.${FRONTEND_DOMAIN} redirige (301) al dominio canónico en vez de
      # servir el mismo contenido en dos hosts — evita contenido duplicado
      # de cara a SEO y necesita su propio router porque la regla de
      # nexoat-web de arriba no matchea el host "www".
      - traefik.http.routers.nexoat-web-www.entrypoints=websecure
      - traefik.http.routers.nexoat-web-www.rule=Host(`www.${FRONTEND_DOMAIN}`)
      - traefik.http.routers.nexoat-web-www.tls.certresolver=letsencrypt
      - traefik.http.routers.nexoat-web-www.middlewares=nexoat-www-redirect
      - traefik.http.middlewares.nexoat-www-redirect.redirectregex.regex=^https://www\.(.+)
      - traefik.http.middlewares.nexoat-www-redirect.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.nexoat-www-redirect.redirectregex.permanent=true

  # Analítica propia (self-hosted) — ver docs/features/analytics-umami.md.
  # Postgres separada de nexoat-db a propósito: no mezclar el ciclo de vida
  # (migraciones/backups) de la DB de negocio con el esquema de Umami.
  umami-db:
    image: postgres:15-alpine
    container_name: nexoat-umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U umami']
      interval: 10s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: nexoat-umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      umami-db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.nexoat-analytics.entrypoints=websecure
      - traefik.http.routers.nexoat-analytics.rule=Host(`${ANALYTICS_DOMAIN}`)
      - traefik.http.routers.nexoat-analytics.tls.certresolver=letsencrypt
      - traefik.http.services.nexoat-analytics.loadbalancer.server.port=3000

volumes:
  postgres_data:
  umami_db_data:
